[package]
name = "oodle-bridge"
repository = "https://github.com/mewnoir/oodle-bridge"
description = "A cross-platform native library for Oodle compression and decompression"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
keywords = ["oodle", "compression", "decompression", "ffi"]
categories = ["compression"]
exclude = [
    "oodle/",
    "test-data/",
    "pokemon-test-data/",
    "target/",
    "build/",
    ".git/",
    ".github/",
    ".vscode/",
    "flake.*",
    "rustfmt.toml",
]

[lib]
name = "oodle_bridge"
crate-type = ["rlib", "cdylib"]

[dependencies]
safe_arch = "0.7.4"
thiserror = "2.0.11"

[build-dependencies]
bindgen = "0.71.1"
cc = { version = "1.2.15", features = ["parallel"] }

[dev-dependencies]
criterion = "0.5.1"

[[bench]]
name = "decompress"
harness = false

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
debug = false
strip = "symbols"
lto = true
codegen-units = 1
incremental = false